[package]
name = "shifty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "3.0.0"
bytes = "1.11.1"
crossbeam-channel = "0.5.15"
dashmap = "6.2.1"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tokio-test = "0.4.5"
